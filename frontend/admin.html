<!doctype html>
<html lang="ru" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ-панель — Салон красоты «Гармония»</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full bg-slate-100 text-slate-900 antialiased">

  <section id="login-view" class="min-h-screen grid place-items-center px-4">
    <form id="login-form" class="w-full max-w-sm bg-white rounded-3xl border border-slate-200 shadow-sm p-8 space-y-5">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Вход для персонала</h1>
        <p class="text-sm text-slate-500 mt-1">Панель управления салоном</p>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-2">Логин</label>
        <input id="login" type="text" required autocomplete="username"
          class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400 transition">
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-2">Пароль</label>
        <input id="password" type="password" required autocomplete="current-password"
          class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400 transition">
      </div>
      <div id="login-error" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-2xl p-4"></div>
      <button type="submit" class="w-full px-8 py-3 rounded-2xl bg-slate-900 text-white font-semibold hover:bg-slate-700 active:scale-[.98] transition">Войти</button>
    </form>
  </section>

  <div id="panel-view" class="hidden min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200">
      <div class="max-w-6xl mx-auto px-4 sm:px-8 py-4 flex items-center justify-between">
        <h1 class="text-lg font-bold tracking-tight">Админ-панель · <a href="/" class="hover:text-rose-600 transition">«Гармония»</a></h1>
        <button id="logout" class="text-sm font-semibold text-slate-500 hover:text-slate-900 transition">Выйти</button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto w-full px-4 sm:px-8 py-8 space-y-8">
      <section>
        <div class="grid sm:grid-cols-3 gap-4">
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
            <p class="text-sm font-semibold text-slate-500">Выручка (завершённые)</p>
            <p id="stat-revenue" class="text-3xl font-bold mt-2">—</p>
          </div>
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
            <p class="text-sm font-semibold text-slate-500">Записей за месяц</p>
            <p id="stat-month" class="text-3xl font-bold mt-2">—</p>
          </div>
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
            <p class="text-sm font-semibold text-slate-500">Активных предстоящих</p>
            <p id="stat-upcoming" class="text-3xl font-bold mt-2">—</p>
          </div>
        </div>
      </section>

      <section class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
        <div class="flex flex-wrap items-end gap-4 justify-between mb-5">
          <h2 class="text-xl font-bold tracking-tight">Записи</h2>
          <div class="flex items-end gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Фильтр по дате</label>
              <input id="date-filter" type="date"
                class="rounded-2xl border border-slate-300 px-4 py-2 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400 transition">
            </div>
            <button id="clear-filter" class="text-sm font-semibold text-slate-500 hover:text-slate-900 transition px-2 py-2">Сбросить</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-xs font-semibold text-slate-500 uppercase tracking-wide border-b border-slate-200">
                <th class="py-3 pr-4">Дата и время</th>
                <th class="py-3 pr-4">Клиент</th>
                <th class="py-3 pr-4">Телефон</th>
                <th class="py-3 pr-4">Мастер</th>
                <th class="py-3 pr-4">Услуга</th>
                <th class="py-3 pr-4">Цена</th>
                <th class="py-3 pr-4">Статус</th>
                <th class="py-3">Действия</th>
              </tr>
            </thead>
            <tbody id="appointments-body" class="divide-y divide-slate-100"></tbody>
          </table>
          <p id="appointments-empty" class="hidden text-sm text-slate-500 mt-4">Записей нет.</p>
        </div>
      </section>

      <section class="grid lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
          <h2 class="text-xl font-bold tracking-tight mb-4">Добавить мастера</h2>
          <form id="master-form" class="space-y-4">
            <input id="master-name" required placeholder="Имя мастера" class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400 transition">
            <input id="master-specialty" required placeholder="Специальность" class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400 transition">
            <input id="master-phone" placeholder="Телефон (необязательно)" class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400 transition">
            <div>
              <p class="text-xs font-semibold text-slate-500 mb-2">Услуги</p>
              <div id="master-services" class="flex flex-wrap gap-3 text-sm"></div>
            </div>
            <div id="master-msg" class="hidden text-sm rounded-2xl p-4"></div>
            <button type="submit" class="px-8 py-3 rounded-2xl bg-slate-900 text-white font-semibold hover:bg-slate-700 active:scale-[.98] transition">Добавить</button>
          </form>
        </div>

        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
          <h2 class="text-xl font-bold tracking-tight mb-4">Добавить услугу</h2>
          <form id="service-form" class="space-y-4">
            <input id="service-title" required placeholder="Название услуги" class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400 transition">
            <input id="service-price" required type="number" min="0" step="0.01" placeholder="Цена, ₽" class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400 transition">
            <input id="service-duration" required type="number" min="15" step="15" value="60" placeholder="Длительность, мин" class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400 transition">
            <textarea id="service-description" rows="2" placeholder="Описание (необязательно)" class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400 transition"></textarea>
            <div id="service-msg" class="hidden text-sm rounded-2xl p-4"></div>
            <button type="submit" class="px-8 py-3 rounded-2xl bg-slate-900 text-white font-semibold hover:bg-slate-700 active:scale-[.98] transition">Добавить</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <div id="edit-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 grid place-items-center px-4">
    <div class="bg-white rounded-3xl border border-slate-200 shadow-xl w-full max-w-md p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold tracking-tight">Редактирование записи</h3>
        <button id="edit-close" class="text-slate-400 hover:text-slate-900 text-xl leading-none transition">&times;</button>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Имя клиента</label>
        <input id="edit-name" class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400 transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Телефон</label>
        <input id="edit-phone" class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-400 transition">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Услуга</label>
          <select id="edit-service" class="w-full rounded-2xl border border-slate-300 px-3 py-2.5 bg-slate-50 focus:bg-white focus:outline-none transition"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Мастер</label>
          <select id="edit-master" class="w-full rounded-2xl border border-slate-300 px-3 py-2.5 bg-slate-50 focus:bg-white focus:outline-none transition"></select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Дата</label>
          <input id="edit-date" type="date" class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 bg-slate-50 focus:bg-white focus:outline-none transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Время</label>
          <input id="edit-time" type="time" step="900" class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 bg-slate-50 focus:bg-white focus:outline-none transition">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Статус</label>
        <select id="edit-status" class="w-full rounded-2xl border border-slate-300 px-3 py-2.5 bg-slate-50 focus:bg-white focus:outline-none transition">
          <option value="pending">Ожидается</option>
          <option value="completed">Завершена</option>
          <option value="cancelled">Отменена</option>
        </select>
      </div>
      <div id="edit-msg" class="hidden text-sm rounded-2xl p-4"></div>
      <div class="flex gap-3 pt-1">
        <button id="edit-save" class="flex-1 px-6 py-3 rounded-2xl bg-slate-900 text-white font-semibold hover:bg-slate-700 active:scale-[.98] transition">Сохранить</button>
        <button id="edit-cancel" class="px-6 py-3 rounded-2xl border border-slate-300 font-semibold text-slate-600 hover:bg-slate-50 transition">Отмена</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
